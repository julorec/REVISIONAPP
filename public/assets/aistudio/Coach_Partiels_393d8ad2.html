const MEMO_ALL={c:MEMO_C,m:MEMO_M,e:MEMO_E};
function viewMemo(){
  let h='<div class="memo">';
  MEMO_ALL[SUB].forEach(([k,t,items])=>{h+='<details'+(k===memoOpen?" open":"")+' id="m-'+k+'"><summary>'+t+'</summary><ul>'+items.map(i=>'<li>'+i+'</li>').join("")+'</ul></details>'});
  h+='</div>'+(SUB==="c"?'<p class="note">Les fonctions fournies sont à la fin du polycopié de cours, autorisé demain.</p>':'<p class="note">Ces fiches rappellent l\'essentiel : elles ne remplacent pas ton cours.</p>');
  $("#main").innerHTML=h;
}
function subSummary(k){
  const qs=ALLQ.filter(q=>q.s===k); let tries=0,right=0,seen=0;
  qs.forEach(q=>{ const t=stat(q.id); tries+=t[0]; right+=t[1]; if(t[0]) seen++ });
  const sims=P().sims.filter(m=>(m.s||"c")===k);
  return {n:qs.length,tries,right,seen,best:sims.length?Math.max.apply(null,sims.map(m=>m.score)):null,sims:sims.length};
}
const THK="coach-theme.v1";
function curTheme(){ try{ return localStorage.getItem(THK)||"auto" }catch(e){ return "auto" } }
function setTheme(m){ try{ localStorage.setItem(THK,m) }catch(e){} applyTheme() }
function applyTheme(){ const m=curTheme(), r=document.documentElement; if(m==="light"||m==="dark") r.setAttribute("data-theme",m); else r.removeAttribute("data-theme") }
applyTheme();
function themeBtns(){ return '<span class="thb" role="group" aria-label="Affichage">'+[['light','☀','Clair'],['dark','☾','Sombre'],['auto','A','Auto']].map(function(x){return '<button data-th="'+x[0]+'" title="'+x[2]+'" aria-label="'+x[2]+'" aria-pressed="'+(curTheme()===x[0])+'">'+x[1]+'</button>'}).join('')+'</span>' }
function themeRow(){ return '<div class="themerow"><span class="label" style="margin:0">Affichage</span>'+[['light','☀ Clair'],['dark','☾ Sombre'],['auto','Auto']].map(function(x){return '<button class="chip" data-th="'+x[0]+'" aria-pressed="'+(curTheme()===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>' }
function viewHome(){
  let h='<div class="hero ban"><img src="'+STK[0]+'" alt="Promo ESET · INSA 3A"></div>';
  h+='<p class="label">Choisis une matière</p><div class="subjgrid">';
  Object.keys(CFG).forEach(function(k){
    const c=CFG[k];
    if(k!=="c"){ h+='<div class="sc-card wip"><h3>'+esc(c.name)+'</h3><span class="meta">En cours de construction</span><span class="go">Bientôt disponible</span></div>'; return }
    const m=subSummary(k), r=m.tries?Math.round(m.right/m.tries*100):null;
    h+='<button class="sc-card" data-go="'+k+'"><h3>'+esc(c.name)+'</h3><span class="meta">Entrées-sorties, tableaux, pointeurs, structures, énumérations</span>'+
      '<span class="meta">'+m.n+' questions · '+m.seen+' vues'+(m.best!==null?' · meilleure simulation '+m.best+'/20':'')+'</span>'+
      '<div class="bar2" aria-hidden="true"><i style="width:'+(r===null?0:r)+'%"></i></div>'+
      '<span class="meta">'+(r===null?'Pas encore commencé':'Réussite : '+r+' %')+'</span><span class="go">Ouvrir →</span></button>';
  });
  h+='</div><p class="note" style="margin-top:0">La discussion est dans la colonne de droite (sur téléphone, le bouton « Discussion » en bas à droite).</p>';
  $("#main").innerHTML=h;
}
function hdr(){
  const c=CFG[SUB];
  $("#subtxt").textContent=QS.length+" questions "+c.intro+". Il garde tes résultats, te dit quoi retravailler et classe la classe.";
  const home=view==="home";
  $("#tabs").hidden=home; $("#subj").hidden=true; $("#homebtn").hidden=home;
  $("#h1").textContent=home?"Coach Partiels":(SUB==="c"?"Ton coach pour le DS1 de C":"Ton coach : "+c.name);
  if(home){ $("#subtxt").textContent="Entraîne-toi matière par matière : le coach note tes exploits (et tes bourdes), te dit quoi réviser avant que ça pique, et classe toute la promo sans pitié." }
  $("#subj").innerHTML=Object.keys(CFG).map(k=>'<button class="chip" role="tab" data-s="'+k+'" aria-pressed="'+(k===SUB)+'">'+esc(CFG[k].name)+'</button>').join("");
}
function who(){
  const w=$("#who"); w.innerHTML=store.cur?(view==="home"?themeBtns():'')+'Salut <b>'+esc(P().name)+'</b> · <button class="link" data-act="chg">changer</button>':"";
}
function parkUI(){
  const b=$("#parkbar"); if(!b) return;
  if(parked&&store.cur&&!run){ b.hidden=false; b.innerHTML='<span>'+(parked.kind==="sim"?"Simulation DS":"Entraînement")+' ('+esc(CFG[parked.sub||"c"].name)+') en cours : question '+(parked.i+1)+' / '+parked.list.length+'. Tes réponses sont gardées.</span><span><button class="btn" data-act="resume">Reprendre</button> <button class="btn ghost" data-act="drop">Abandonner</button></span>' }
  else { b.hidden=true; b.innerHTML="" }
}
function syncPanel(){
  if(typeof UIDV!=="undefined"&&UIDV&&store.cur){ noteUser(UIDV,P().name); buildColors() }
  watchUnread();
  const ctx="g";
  if(ctx!==chatCtx){ chatCtx=ctx; setChatCh(ctx) } else { subChat(); renderPanel() }
}
function show(){
  run=null; confirmReset=false; hdr();
  if(parked&&store.cur&&(parked.sub||"c")===SUB&&((tab==="sim"&&parked.kind==="sim")||(tab==="train"&&parked.kind!=="sim"))){ view="subj"; run=parked; parked=null; document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab)); who(); parkUI(); draw(); return }
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===tab&&!!store.cur));
  who();
  if(!store.cur){ gate(); renderPanel(); return }
  if(view==="home"){ viewHome(); parkUI(); syncPanel(); return }
  if(tab==="sim")viewSim(); else if(tab==="train")viewTrain(); else if(tab==="suivi")viewSuivi(); else if(tab==="board")viewBoard(); else viewMemo();
  parkUI(); syncPanel();
}
function login(name){ setSub((store.subj&&CFG[store.subj])?store.subj:"c");
  name=name.trim(); if(!name)return; const k=nameKey(name);
  const sh=$("#share")?$("#share").checked:false;
  if(!store.profiles[k]) store.profiles[k]={name:name,q:{},sims:[],share:sh};
  else if($("#share")) store.profiles[k].share=sh;
  parked=null; store.cur=k; view="home"; save(); tab="sim"; show();
}

/* ---------- événements ---------- */
document.addEventListener("submit",e=>{ if(e.target.id==="gate"){ e.preventDefault(); login($("#name").value) } });
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.parentElement&&t.parentElement.id==="tabs"){ if(!store.cur)return; if(run&&run.i<run.list.length) parked=run; tab=t.dataset.t; show(); return }
  if(t.dataset.go){ if(!store.cur) return; if(run&&run.i<run.list.length) parked=run; setSub(t.dataset.go); store.subj=SUB; save(); view="subj"; tab="sim"; show(); window.scrollTo({top:0}); return }
  if(t.dataset.ch){ setChatCh(t.dataset.ch); return }
  if(t.dataset.th){ setTheme(t.dataset.th); show(); return }
  if(t.dataset.s){ if(!store.cur||t.dataset.s===SUB) return; if(run&&run.i<run.list.length) parked=run; setSub(t.dataset.s); store.subj=SUB; view="subj"; save(); if(tab==="memo"||tab==="train"||tab==="sim"||tab==="suivi"||tab==="board"||tab==="chat"){} show(); window.scrollTo({top:0}); return }
  if(t.dataset.who){ parked=null; store.cur=t.dataset.who; view="home"; save(); tab="sim"; show(); return }
  if(t.dataset.c){ topic=t.dataset.c; viewTrain(); return }
  if(t.dataset.n){ count=t.dataset.n==="all"?"all":10; viewTrain(); return }
  if(t.dataset.f&&run){ revFilter=t.dataset.f; const y=window.scrollY; $("#main").innerHTML=result(); window.scrollTo({top:y}); return }
  if(t.dataset.o!==undefined&&run){ if(run.ans[run.i]===null){ run.sel[run.i]=+t.dataset.o; draw() } return }
  const act=t.dataset.act||""; const [a,arg]=act.split(":");
  switch(a){
    case "chg": parked=null; store.cur=null; save(); view="home"; show(); return;
    case "home": if(run&&run.i<run.list.length) parked=run; view="home"; show(); window.scrollTo({top:0}); return;
    case "chatopen": chatOpen=true; renderPanel(); markSeen(); { const i=$("#chatin"); if(i) i.focus() } return;
    case "chatclose": chatOpen=false; renderPanel(); return;
    case "resume": if(parked){ if((parked.sub||"c")!==SUB) setSub(parked.sub||"c"); view="subj"; tab=parked.kind==="sim"?"sim":"train"; show() } return;
    case "drop": parked=null; parkUI(); return;
    case "goto": tab=arg; show(); window.scrollTo({top:0}); return;
    case "memo": tab="memo"; memoOpen=arg; show(); setTimeout(()=>{const d=$("#m-"+arg); if(d)d.scrollIntoView({block:"start"})},0); return;
    case "train": { const pool=QS.filter(q=>q.topic===arg); tab="train"; topic=arg; start(wpick(pool,10),"now","train"); return }
    case "missed": { const pool=QS.filter(q=>stat(q.id)[2]===0); if(pool.length) start(shuffle(pool).slice(0,20),"now","train"); return }
    case "again": tab=run&&run.kind==="sim"?"sim":"train"; show(); window.scrollTo({top:0}); return;
    case "redo": start(shuffle(missed),"now","train"); return;
    case "share": P().share=true; save(); syncBoard().then(function(){ if(tab==="board"&&!run) viewBoard() }); viewBoard(); return;
    case "unshare": P().share=false; save(); if(DB&&UIDV){ Object.keys(CFG).forEach(function(k){ DB.doc(CFG[k].board+"/"+UIDV).delete().catch(function(){}) }); synced=false } viewBoard(); return;
    case "reset1": confirmReset=true; viewSuivi(); return;
    case "reset0": confirmReset=false; viewSuivi(); return;
    case "reset2": P().q={}; P().sims=[]; save(); if(DB&&UIDV&&P().share===true){ Object.keys(CFG).forEach(function(k){ DB.doc(CFG[k].board+"/"+UIDV).delete().catch(function(){}) }); synced=false; triedSync=false } confirmReset=false; viewSuivi(); return;
  }
  switch(t.id){
    case "go":
      if(tab==="sim"){ let list=[]; TOPICS.forEach(([k])=>{list=list.concat(wpick(QS.filter(q=>q.topic===k),QUOTA[k]))}); start(shuffle(list),"end","sim") }
      else { const pool=topic==="all"?QS:QS.filter(q=>q.topic===topic); start(wpick(pool,count==="all"?pool.length:count),"now","train") }
      break;
    case "val": { const q=run.list[run.i]; run.ans[run.i]=run.sel[run.i]; rec(q.id,isRight(q,run.ans[run.i])); if(run.feedback==="end"){run.i++;window.scrollTo({top:0})} draw(); break }
    case "next": run.i++; draw(); window.scrollTo({top:0}); break;
    case "prev": run.i--; draw(); break;
  }
});
setSub((store.subj&&CFG[store.subj])?store.subj:"c");
show();
</script>
